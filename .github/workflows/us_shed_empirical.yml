name: U.S. SHED 2024-2025 Official Microdata Recontact Analysis
on:
  push:
    branches:
      - us-shed-empirical-data-20261117
    paths:
      - '.github/workflows/us_shed_empirical.yml'
      - 'research/us_shed/**'
  workflow_dispatch:
jobs:
  shed-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout isolated analysis branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<0.16"
      - name: Download official Board ZIPs and compute aggregated regression only
        run: python research/us_shed/official_panel_analysis.py
      - name: Publish non-identifying statistical outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: us-shed-2024-2025-aggregated-results
          path: shed_results/
          if-no-files-found: error
          retention-days: 30
