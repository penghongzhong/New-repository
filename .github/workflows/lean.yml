name: Lean CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test formalization gate
        run: python3 scripts/check_formalization.py --self-test

      - name: Check tracked sources
        run: python3 scripts/check_formalization.py --sources

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          lake update
          python3 scripts/check_formalization.py --dependencies
          lake exe cache get

      - name: Build
        run: lake build

      - name: Check theorem axioms
        run: python3 scripts/check_formalization.py --axioms
